name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleCustom

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-debug
          path: app/build/outputs/apk/custom/*.apk

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/custom/*.apk HeliBoard-voice-comma.apk
          gh release delete voice-comma-build --yes --cleanup-tag || true
          gh release create voice-comma-build HeliBoard-voice-comma.apk --target "${{ github.sha }}" --title "HeliBoard v4.3-beta1 + voice fix + comma popup" --notes "Optimized build from branch voice-fix-comma-popup" --prerelease

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
